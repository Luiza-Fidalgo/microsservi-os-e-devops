events {}

http {
    resolver 127.0.0.11 valid=1s ipv6=off;

    log_format rotas '$request -> $upstream_addr ($status)';
    access_log /dev/stdout rotas;

    server {
        listen 8081;

        location / {
            set $backend catalogo;
            proxy_pass http://$backend:8081;
        }
    }
}
