services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: needledrop_catalogo
      POSTGRES_USER: needledrop
      POSTGRES_PASSWORD: needledrop
    ports:
      - "${POSTGRES_PORT:-5434}:5432"
    volumes:
      - catalogo_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U needledrop -d needledrop_catalogo"]
      interval: 5s
      timeout: 5s
      retries: 10

  postgres-sessoes:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: needledrop_sessoes
      POSTGRES_USER: needledrop
      POSTGRES_PASSWORD: needledrop
    ports:
      - "${SESSOES_POSTGRES_PORT:-5435}:5432"
    volumes:
      - sessoes_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U needledrop -d needledrop_sessoes"]
      interval: 5s
      timeout: 5s
      retries: 10

  catalogo:
    build:
      context: .
      dockerfile: catalogo-service/Dockerfile
    environment:
      PORT: 8081
      DB_URL: jdbc:postgresql://postgres:5432/needledrop_catalogo
      DB_USER: needledrop
      DB_PASSWORD: needledrop
    ports:
      - "${CATALOGO_PORT:-8081}:8081"
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://localhost:8081/actuator/health || exit 1"]
      interval: 10s
      timeout: 5s
      start_period: 30s
      retries: 6

  sessoes:
    build:
      context: .
      dockerfile: sessoes-service/Dockerfile
    environment:
      PORT: 8082
      DB_URL: jdbc:postgresql://postgres-sessoes:5432/needledrop_sessoes
      DB_USER: needledrop
      DB_PASSWORD: needledrop
      CATALOGO_URL: http://catalogo:8081
    ports:
      - "${SESSOES_PORT:-8082}:8082"
    depends_on:
      postgres-sessoes:
        condition: service_healthy
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://localhost:8082/actuator/health || exit 1"]
      interval: 10s
      timeout: 5s
      start_period: 30s
      retries: 6

volumes:
  catalogo_data:
  sessoes_data:
