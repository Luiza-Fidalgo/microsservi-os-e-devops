spring.application.name=sessoes-service
server.port=${PORT:8082}

spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5435/needledrop_sessoes}
spring.datasource.username=${DB_USER:needledrop}
spring.datasource.password=${DB_PASSWORD:needledrop}

spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false

# O endereco do catalogo pode mudar sem alterar o codigo Java.
catalogo.url=${CATALOGO_URL:http://localhost:8081}

# Endpoint usado pelo Docker para verificar se o servico esta funcionando.
management.endpoints.web.exposure.include=health
